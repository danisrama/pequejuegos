<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#fff7e9"><title>Mis juegos</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff7e9;color:#344054;touch-action:manipulation}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px}h1{font-size:clamp(22px,4vw,36px);margin:0}button{border:0;border-radius:20px;background:#fff;box-shadow:0 3px 0 #e7ddcc;padding:12px 20px;font-size:clamp(18px,3vw,25px);font-weight:700;color:#344054;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(2px)}.selected{outline:5px solid #5b96d9}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:8px}.stage{width:min(92vw,780px);margin:8px auto;position:relative;aspect-ratio:4/3;background:white;border-radius:25px;overflow:hidden;box-shadow:0 8px 24px #d5c9b477}canvas{display:block;width:100%;height:100%;touch-action:none}.bottom{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:12px}.color{width:56px;height:56px;border-radius:50%;padding:0;border:5px solid white;box-shadow:0 2px 6px #999}.color.selected{outline:4px solid #344054}.piece{position:absolute;touch-action:none;user-select:none;cursor:grab;box-shadow:0 2px 8px #7779;border:2px solid white;border-radius:8px}.target{position:absolute;border:3px dashed #b4c3d1;border-radius:8px;background:#e7f0f6aa}.message{text-align:center;font-size:23px;font-weight:700;padding:6px}#puzzle{position:absolute;inset:0;display:none}#puzzle .piece{background-repeat:no-repeat}#home{display:none}#home button{font-size:35px;padding:20px}#celebrate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff9;font-size:70px;z-index:20;pointer-events:none}@media(max-height:650px){header{padding:5px 15px}.toolbar{padding:2px}.stage{width:min(74vw,680px);max-height:67vh;aspect-ratio:4/3}.bottom{padding:5px}.color{width:43px;height:43px}button{padding:7px 13px}}
</style></head><body><header><button id="homeBtn" aria-label="Elegir dibujo">⌂ Dibujos</button><h1>🎨 Pinto y juego</h1><button id="reset">↻ Empezar</button></header><div class="toolbar" id="choices"><button data-shape="cat">🐱 Gato</button><button data-shape="fish">🐟 Pez</button><button data-shape="flower">🌼 Flor</button></div><div class="message" id="message">¡Pinta con el dedo!</div><div class="stage" id="stage"><canvas id="canvas" width="800" height="600"></canvas><div id="puzzle"></div><div id="celebrate">🎉 ⭐ 🎉</div></div><div class="bottom" id="bottom"><button class="color selected" data-color="#f4a261" style="background:#f4a261" aria-label="Naranja"></button><button class="color" data-color="#f26b83" style="background:#f26b83" aria-label="Rosa"></button><button class="color" data-color="#74c69d" style="background:#74c69d" aria-label="Verde"></button><button class="color" data-color="#80bfff" style="background:#80bfff" aria-label="Azul"></button><button class="color" data-color="#bd93f9" style="background:#bd93f9" aria-label="Violeta"></button><button id="done">🧩 ¡Puzle!</button></div><script>
(function(){'use strict';var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),puzzle=document.getElementById('puzzle'),stage=document.getElementById('stage'),message=document.getElementById('message'),bottom=document.getElementById('bottom');var shape='cat',color='#f4a261',drawing=false,strokes=0,mode='paint',solved=0;var W=800,H=600;function path(c,s){c.beginPath();if(s==='cat'){c.moveTo(225,205);c.lineTo(210,95);c.lineTo(330,160);c.quadraticCurveTo(400,140,470,160);c.lineTo(590,95);c.lineTo(575,205);c.bezierCurveTo(690,300,630,480,400,495);c.bezierCurveTo(170,480,110,300,225,205);c.closePath()}else if(s==='fish'){c.moveTo(205,300);c.bezierCurveTo(300,125,565,160,625,300);c.bezierCurveTo(565,440,300,475,205,300);c.lineTo(85,180);c.lineTo(85,420);c.closePath()}else{for(var i=0;i<8;i++){var a=i*Math.PI/4;var x=400+140*Math.cos(a),y=290+140*Math.sin(a);c.moveTo(x+65,y);c.arc(x,y,65,0,Math.PI*2)}c.moveTo(400,330);c.lineTo(400,525);c.lineWidth=35;c.strokeStyle='#79ba80';c.stroke();c.beginPath();c.arc(400,290,85,0,Math.PI*2)}}function outline(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.save();path(ctx,shape);ctx.fillStyle='#fff9e7';ctx.fill();ctx.lineWidth=12;ctx.strokeStyle='#49576b';ctx.stroke();ctx.restore();details()}function details(){ctx.save();ctx.fillStyle='#49576b';if(shape==='cat'){ctx.beginPath();ctx.arc(330,300,12,0,7);ctx.arc(470,300,12,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(385,350);ctx.lineTo(415,350);ctx.lineTo(400,365);ctx.closePath();ctx.fill()}else if(shape==='fish'){ctx.beginPath();ctx.arc(510,280,13,0,7);ctx.fill()}else{ctx.beginPath();ctx.arc(400,290,52,0,7);ctx.fillStyle='#ffdc68';ctx.fill()}ctx.restore()}function point(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function dab(e){if(mode!=='paint')return;var p=point(e);ctx.save();path(ctx,shape);ctx.clip();ctx.globalAlpha=0.28;ctx.globalCompositeOperation='source-over';ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,55,0,Math.PI*2);ctx.fill();ctx.restore();details();strokes++}canvas.addEventListener('pointerdown',function(e){drawing=true;try{canvas.setPointerCapture(e.pointerId)}catch(_){}dab(e)});canvas.addEventListener('pointermove',function(e){if(drawing)dab(e)});['pointerup','pointercancel'].forEach(function(x){canvas.addEventListener(x,function(){drawing=false})});function select(s){shape=s;mode='paint';strokes=0;puzzle.style.display='none';puzzle.innerHTML='';canvas.style.visibility='visible';bottom.style.display='flex';message.textContent='¡Pinta con el dedo!';outline();document.querySelectorAll('[data-shape]').forEach(function(b){b.classList.toggle('selected',b.dataset.shape===s)})}document.querySelectorAll('[data-shape]').forEach(function(b){b.onclick=function(){select(b.dataset.shape)}});document.querySelectorAll('[data-color]').forEach(function(b){b.onclick=function(){color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(function(v){v.classList.remove('selected')});b.classList.add('selected')}});document.getElementById('reset').onclick=function(){select(shape)};document.getElementById('homeBtn').onclick=function(){select('cat')};function startPuzzle(){if(mode==='puzzle')return;mode='puzzle';solved=0;var url=canvas.toDataURL('image/png');canvas.style.visibility='hidden';bottom.style.display='none';puzzle.style.display='block';puzzle.innerHTML='';message.textContent='¡Pon cada pieza en su sitio!';var positions=[[.19,.11],[.51,.11],[.19,.45],[.51,.45]],size=.30;var order=[2,0,3,1];for(var i=0;i<4;i++){(function(i){var target=document.createElement('div');target.className='target';target.style.left=(positions[i][0]*100)+'%';target.style.top=(positions[i][1]*100)+'%';target.style.width=(size*100)+'%';target.style.height=(size*100)+'%';puzzle.appendChild(target);var piece=document.createElement('div');piece.className='piece';piece.style.width=(size*100)+'%';piece.style.height=(size*100)+'%';piece.style.backgroundImage='url('+url+')';piece.style.backgroundSize=(100/size)+'% '+(100/size)+'%';piece.style.backgroundPosition=(i%2?'-100%':'0%')+' '+(i>=2?'-100%':'0%');/* source quadrants */piece.style.backgroundSize='200% 200%';piece.style.left=(positions[order[i]][0]*100)+'%';piece.style.top=(positions[order[i]][1]*100)+'%';piece.dataset.index=i;puzzle.appendChild(piece);var sx,sy,ox,oy,drag=false;piece.addEventListener('pointerdown',function(e){if(piece.dataset.locked)return;drag=true;sx=e.clientX;sy=e.clientY;ox=parseFloat(piece.style.left);oy=parseFloat(piece.style.top);piece.style.zIndex=10;piece.setPointerCapture(e.pointerId)});piece.addEventListener('pointermove',function(e){if(!drag)return;var r=puzzle.getBoundingClientRect();piece.style.left=Math.max(0,Math.min(70,ox+(e.clientX-sx)/r.width*100))+'%';piece.style.top=Math.max(0,Math.min(70,oy+(e.clientY-sy)/r.height*100))+'%'});piece.addEventListener('pointerup',function(){if(!drag)return;drag=false;var x=parseFloat(piece.style.left),y=parseFloat(piece.style.top),tx=positions[i][0]*100,ty=positions[i][1]*100;if(Math.abs(x-tx)<13&&Math.abs(y-ty)<13){piece.style.left=tx+'%';piece.style.top=ty+'%';piece.style.zIndex=1;piece.dataset.locked='yes';solved++;if(solved===4){message.textContent='¡Muy bien! 🎉';document.getElementById('celebrate').style.display='flex';setTimeout(function(){document.getElementById('celebrate').style.display='none';select(shape)},1800)}}else{piece.style.zIndex=1}})})(i)}}document.getElementById('done').onclick=startPuzzle;select('cat');})();
</script></body></html>
