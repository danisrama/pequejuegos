<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff7e9">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Pequejuegos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mis juegos</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:#fff7e9;color:#344054;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.home{width:min(100%,1040px);margin:auto;padding:24px}
.home-head{text-align:center;padding:12px 0 22px}
.home-head h1{font-size:clamp(30px,6vw,48px);margin:0 0 8px}
.home-head p{font-size:clamp(18px,3vw,23px);margin:0;color:#687386}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px}
.card{display:flex;min-height:158px;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:24px;background:#fff;box-shadow:0 5px 0 #e7ddcc,0 9px 22px #d5c9b455;padding:16px;transition:transform .12s,box-shadow .12s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #e7ddcc}
.card .icon{font-size:clamp(52px,9vw,72px);line-height:1}
.card .label{font-size:21px;font-weight:750}
.paint{width:min(100%,900px);margin:auto;padding:12px 18px 22px}
.paint-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.paint-head h1{font-size:clamp(22px,4vw,34px);margin:0;text-align:center;white-space:nowrap}
.action{border-radius:20px;background:#fff;box-shadow:0 3px 0 #e7ddcc;padding:10px 16px;font-size:clamp(16px,2.8vw,21px);font-weight:700}
.action:last-child{justify-self:end}
.message{text-align:center;font-size:22px;font-weight:700;padding:12px 4px}
.stage{width:min(92vw,780px);margin:0 auto;position:relative;aspect-ratio:4/3;background:white;border-radius:25px;overflow:hidden;box-shadow:0 8px 24px #d5c9b477}
.stage.puzzle-mode{width:min(92vw,600px);aspect-ratio:2/3}
@media(max-height:650px){.stage.puzzle-mode{width:min(44vh,78vw);max-height:none}}
@media(max-height:500px){.stage.puzzle-mode{width:min(38vh,70vw)}}
canvas{display:block;width:100%;height:100%;touch-action:none}
.bottom{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:14px 0}
.color{width:52px;height:52px;border-radius:50%;padding:0;border:5px solid white;box-shadow:0 2px 6px #999}
.color.selected{outline:4px solid #344054}
#done{border-radius:20px;background:#fff;box-shadow:0 3px 0 #e7ddcc;padding:10px 17px;font-size:19px;font-weight:700}
#puzzle{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;gap:2%;padding:3%}
.puzzle-board{position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.5%;width:min(94%,560px);aspect-ratio:4/3;flex:none;margin:auto auto 0;overflow:hidden;border-radius:14px}
.puzzle-board::before{content:"";position:absolute;z-index:0;inset:0;background-image:var(--puzzle-preview);background-size:100% 100%;background-position:center;filter:blur(3px);opacity:.55;pointer-events:none}
.target{position:relative;z-index:1;min-width:0;min-height:0;border:3px dashed #b4c3d1;border-radius:14px;background:rgba(238,244,248,.38);box-shadow:inset 0 1px 5px #8796a622}
.puzzle-tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.5%;width:min(94%,560px);aspect-ratio:4/3;flex:none;margin:0 auto}
.puzzle-piece{position:relative;width:100%;height:100%;padding:3px;border:3px solid white;border-radius:12px;background:#fff;box-shadow:0 3px 9px #34405455;touch-action:none;user-select:none;cursor:grab;z-index:1}
.puzzle-piece.dragging{z-index:15;box-shadow:0 8px 18px #34405466;cursor:grabbing}
.puzzle-piece canvas{width:100%;height:100%;border-radius:7px;pointer-events:none}
.target .puzzle-piece{position:absolute;inset:0;width:100%;height:100%;max-width:none;padding:2px;cursor:default;z-index:2}
@media(max-width:520px){#puzzle{gap:2%;padding:2%}.puzzle-board,.puzzle-tray{width:98%;gap:1.5%}.target{border-width:2px;border-radius:9px}.puzzle-piece{padding:2px;border-radius:8px}}
#celebrate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff9;font-size:70px;z-index:20;pointer-events:none}
@media(max-width:520px){.home{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:138px}.paint{padding:8px}.paint-head{gap:5px}.action{padding:9px 10px}.color{width:45px;height:45px}}
@media(max-height:650px){.home{padding:10px}.home-head{padding:0 0 10px}.home-head h1{font-size:30px}.card{min-height:110px}.card .icon{font-size:48px}.paint{padding:4px 10px}.message{padding:4px}.stage{width:min(74vw,680px);max-height:67vh}.color{width:42px;height:42px}}
</style>
</head>
<body>
<main id="homeScreen" class="screen active">
  <div class="home">
    <header class="home-head"><h1>🎨 ¿Qué quieres pintar?</h1><p>Elige un dibujo para empezar</p></header>
    <div class="grid">
      <button class="card" data-shape="cat"><span class="icon">🐱</span><span class="label">Gato</span></button>
      <button class="card" data-shape="fish"><span class="icon">🐟</span><span class="label">Pez</span></button>
      <button class="card" data-shape="flower"><span class="icon">🌼</span><span class="label">Flor</span></button>
      <button class="card" data-shape="dog"><span class="icon">🐶</span><span class="label">Perro</span></button>
      <button class="card" data-shape="robot"><span class="icon">🤖</span><span class="label">Robot</span></button>
      <button class="card" data-shape="tree"><span class="icon">🌳</span><span class="label">Árbol</span></button>
      <button class="card" data-shape="car"><span class="icon">🚗</span><span class="label">Coche</span></button>
      <button class="card" data-shape="sun"><span class="icon">☀️</span><span class="label">Sol</span></button>
      <button class="card" data-shape="cloud"><span class="icon">☁️</span><span class="label">Nube</span></button>
      <button class="card" data-shape="mountain"><span class="icon">⛰️</span><span class="label">Montaña</span></button>
      <button class="card" data-shape="house"><span class="icon">🏠</span><span class="label">Casa</span></button>
      <button class="card" data-shape="bus"><span class="icon">🚌</span><span class="label">Autobús</span></button>
    </div>
  </div>
</main>
<section id="paintScreen" class="screen">
  <div class="paint">
    <header class="paint-head"><button class="action" id="homeBtn">‹ Dibujos</button><h1>🎨 Pinto y juego</h1><button class="action" id="reset">↻ Borrar</button></header>
    <div class="message" id="message">¡Pinta con el dedo!</div>
    <div class="stage" id="stage"><canvas id="canvas" width="800" height="600"></canvas><div id="puzzle"></div><div id="celebrate">🎉 ⭐ 🎉</div></div>
    <div class="bottom" id="bottom">
      <button class="color selected" data-color="#f4a261" style="background:#f4a261" aria-label="Naranja"></button>
      <button class="color" data-color="#ec6aa7" style="background:#ec6aa7" aria-label="Magenta"></button>
      <button class="color" data-color="#74c69d" style="background:#74c69d" aria-label="Verde"></button>
      <button class="color" data-color="#80bfff" style="background:#80bfff" aria-label="Azul"></button>
      <button class="color" data-color="#bd93f9" style="background:#bd93f9" aria-label="Lila"></button>
      <button class="color" data-color="#f8c4d4" style="background:#f8c4d4" aria-label="Rosa pálido"></button>
      <button class="color" data-color="#ef5350" style="background:#ef5350" aria-label="Rojo"></button>
      <button class="color" data-color="#ffd166" style="background:#ffd166" aria-label="Amarillo"></button>
      <button id="done">🧩 ¡Puzle!</button>
    </div>
  </div>
</section>
<script>
(function(){
'use strict';
function blockNativeGesture(e){e.preventDefault();}
document.addEventListener('contextmenu',blockNativeGesture,true);
document.addEventListener('selectstart',blockNativeGesture,true);
document.addEventListener('dragstart',blockNativeGesture,true);
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),puzzle=document.getElementById('puzzle'),message=document.getElementById('message'),bottom=document.getElementById('bottom'),homeScreen=document.getElementById('homeScreen'),paintScreen=document.getElementById('paintScreen');
var shape='cat',color='#f4a261',drawing=false,mode='paint',solved=0,W=800,H=600;
function path(c,s){
  c.beginPath();
  if(s==='cat'){
    c.moveTo(225,205);c.lineTo(210,95);c.lineTo(330,160);c.quadraticCurveTo(400,140,470,160);c.lineTo(590,95);c.lineTo(575,205);c.bezierCurveTo(690,300,630,480,400,495);c.bezierCurveTo(170,480,110,300,225,205);c.closePath();
  }else if(s==='fish'){
    c.moveTo(205,300);c.bezierCurveTo(300,125,565,160,625,300);c.bezierCurveTo(565,440,300,475,205,300);c.lineTo(85,180);c.lineTo(85,420);c.closePath();
  }else if(s==='flower'){
    for(var i=0;i<8;i++){var a=i*Math.PI/4,x=400+140*Math.cos(a),y=275+140*Math.sin(a);c.moveTo(x+62,y);c.arc(x,y,62,0,Math.PI*2);}
  }else if(s==='dog'){
    c.moveTo(260,190);c.bezierCurveTo(185,95,130,140,168,285);c.bezierCurveTo(115,360,200,490,400,490);c.bezierCurveTo(600,490,685,360,632,285);c.bezierCurveTo(670,140,615,95,540,190);c.bezierCurveTo(455,145,345,145,260,190);c.closePath();
  }else if(s==='robot'){
    c.moveTo(340,120);c.lineTo(460,120);c.lineTo(460,165);c.lineTo(520,165);c.quadraticCurveTo(550,165,550,195);c.lineTo(550,335);c.quadraticCurveTo(550,365,520,365);c.lineTo(475,365);c.lineTo(475,455);c.lineTo(435,455);c.lineTo(435,390);c.lineTo(365,390);c.lineTo(365,455);c.lineTo(325,455);c.lineTo(325,365);c.lineTo(280,365);c.quadraticCurveTo(250,365,250,335);c.lineTo(250,195);c.quadraticCurveTo(250,165,280,165);c.lineTo(340,165);c.closePath();
  }else if(s==='tree'){
    c.moveTo(350,470);c.lineTo(350,390);c.lineTo(260,390);c.lineTo(315,315);c.lineTo(250,315);c.lineTo(325,220);c.lineTo(285,220);c.lineTo(400,100);c.lineTo(515,220);c.lineTo(475,220);c.lineTo(550,315);c.lineTo(485,315);c.lineTo(540,390);c.lineTo(450,390);c.lineTo(450,470);c.closePath();
  }else if(s==='car'){
    c.moveTo(120,390);c.lineTo(145,320);c.quadraticCurveTo(155,295,185,290);c.lineTo(260,270);c.lineTo(320,190);c.quadraticCurveTo(335,170,360,170);c.lineTo(510,170);c.quadraticCurveTo(535,170,550,195);c.lineTo(610,290);c.quadraticCurveTo(665,300,675,340);c.lineTo(680,390);c.lineTo(650,410);c.lineTo(150,410);c.closePath();
  }else if(s==='sun'){
    for(var j=0;j<32;j++){var a=-Math.PI/2+j*Math.PI/16,r=j%2===0?185:140,x=400+r*Math.cos(a),y=300+r*Math.sin(a);if(j===0)c.moveTo(x,y);else c.lineTo(x,y);}c.closePath();
  }else if(s==='cloud'){
    c.moveTo(205,420);c.bezierCurveTo(145,420,135,350,180,320);c.bezierCurveTo(175,265,250,235,310,275);c.bezierCurveTo(345,190,470,190,495,280);c.bezierCurveTo(560,250,625,290,610,350);c.bezierCurveTo(675,380,640,430,585,430);c.lineTo(205,430);c.closePath();
  }else if(s==='mountain'){
    c.moveTo(85,475);c.lineTo(275,205);c.lineTo(390,350);c.lineTo(520,125);c.lineTo(715,475);c.closePath();
  }else if(s==='house'){
    c.moveTo(220,470);c.lineTo(220,270);c.lineTo(175,270);c.lineTo(400,100);c.lineTo(625,270);c.lineTo(580,270);c.lineTo(580,470);c.closePath();
  }else if(s==='bus'){
    c.moveTo(180,170);c.lineTo(620,170);c.quadraticCurveTo(660,170,660,210);c.lineTo(660,410);c.quadraticCurveTo(660,450,620,450);c.lineTo(180,450);c.quadraticCurveTo(140,450,140,410);c.lineTo(140,210);c.quadraticCurveTo(140,170,180,170);c.closePath();
  }
}
function outline(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.save();path(ctx,shape);ctx.fillStyle='#fff9e7';ctx.fill();ctx.lineWidth=12;ctx.lineJoin='round';ctx.strokeStyle='#49576b';ctx.stroke();ctx.restore();details();
}
function details(){
  ctx.save();ctx.fillStyle='#49576b';ctx.strokeStyle='#49576b';ctx.lineWidth=10;ctx.lineCap='round';
  if(shape==='cat'){
    ctx.beginPath();ctx.arc(330,300,12,0,Math.PI*2);ctx.arc(470,300,12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(385,350);ctx.lineTo(415,350);ctx.lineTo(400,365);ctx.closePath();ctx.fill();
  }else if(shape==='fish'){
    ctx.beginPath();ctx.arc(510,280,13,0,Math.PI*2);ctx.fill();
  }else if(shape==='flower'){
    ctx.beginPath();ctx.moveTo(400,340);ctx.lineTo(400,520);ctx.stroke();ctx.beginPath();ctx.ellipse(365,430,42,18,-.5,0,Math.PI*2);ctx.ellipse(435,465,42,18,.5,0,Math.PI*2);ctx.fillStyle='#74c69d';ctx.fill();ctx.beginPath();ctx.arc(400,275,48,0,Math.PI*2);ctx.fillStyle='#ffdc68';ctx.fill();
  }else if(shape==='dog'){
    ctx.beginPath();ctx.arc(330,300,12,0,Math.PI*2);ctx.arc(470,300,12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(400,350,27,19,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(400,369);ctx.quadraticCurveTo(400,395,378,395);ctx.moveTo(400,369);ctx.quadraticCurveTo(400,395,422,395);ctx.stroke();
  }else if(shape==='robot'){
    ctx.beginPath();ctx.moveTo(400,120);ctx.lineTo(400,82);ctx.stroke();ctx.beginPath();ctx.arc(400,68,13,0,Math.PI*2);ctx.fill();ctx.fillRect(325,220,35,35);ctx.fillRect(440,220,35,35);ctx.beginPath();ctx.moveTo(350,300);ctx.lineTo(450,300);ctx.stroke();
  }else if(shape==='tree'){
    ctx.beginPath();ctx.moveTo(400,150);ctx.lineTo(400,255);ctx.stroke();
  }else if(shape==='car'){
    ctx.beginPath();ctx.moveTo(285,270);ctx.lineTo(330,205);ctx.lineTo(500,205);ctx.lineTo(545,270);ctx.closePath();ctx.fillStyle='#d9efff';ctx.fill();ctx.stroke();ctx.fillStyle='#49576b';ctx.beginPath();ctx.arc(245,405,42,0,Math.PI*2);ctx.arc(555,405,42,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dce4ed';ctx.beginPath();ctx.arc(245,405,17,0,Math.PI*2);ctx.arc(555,405,17,0,Math.PI*2);ctx.fill();
  }else if(shape==='sun'){
    ctx.fillStyle='#49576b';ctx.beginPath();ctx.arc(365,285,11,0,Math.PI*2);ctx.arc(435,285,11,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(400,300,55,.25,Math.PI-.25);ctx.stroke();
  }else if(shape==='cloud'){
    ctx.beginPath();ctx.arc(350,335,10,0,Math.PI*2);ctx.arc(455,335,10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(402,350,35,.2,Math.PI-.2);ctx.stroke();
  }else if(shape==='mountain'){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(232,266);ctx.lineTo(275,205);ctx.lineTo(318,260);ctx.lineTo(286,250);ctx.lineTo(270,271);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(470,211);ctx.lineTo(520,125);ctx.lineTo(579,232);ctx.lineTo(535,210);ctx.lineTo(510,235);ctx.closePath();ctx.fill();ctx.strokeStyle='#79ba80';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(95,470);ctx.lineTo(705,470);ctx.stroke();
  }else if(shape==='house'){
    ctx.beginPath();ctx.moveTo(330,470);ctx.lineTo(330,350);ctx.quadraticCurveTo(400,300,470,350);ctx.lineTo(470,470);ctx.closePath();ctx.fillStyle='#f2c078';ctx.fill();ctx.stroke();ctx.fillStyle='#d9efff';ctx.fillRect(255,310,70,70);ctx.strokeRect(255,310,70,70);ctx.fillRect(475,310,70,70);ctx.strokeRect(475,310,70,70);
  }else if(shape==='bus'){
    ctx.fillStyle='#d9efff';ctx.fillRect(180,205,100,115);ctx.fillRect(295,205,100,115);ctx.fillRect(410,205,100,115);ctx.fillRect(525,205,95,115);ctx.strokeRect(180,205,100,115);ctx.strokeRect(295,205,100,115);ctx.strokeRect(410,205,100,115);ctx.strokeRect(525,205,95,115);ctx.fillStyle='#49576b';ctx.fillRect(560,350,45,12);ctx.beginPath();ctx.arc(250,440,43,0,Math.PI*2);ctx.arc(550,440,43,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dce4ed';ctx.beginPath();ctx.arc(250,440,18,0,Math.PI*2);ctx.arc(550,440,18,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function point(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function dab(e){if(mode!=='paint')return;var p=point(e);ctx.save();path(ctx,shape);ctx.clip();ctx.globalAlpha=.10;ctx.globalCompositeOperation='source-over';ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,55,0,Math.PI*2);ctx.fill();ctx.restore();details();}
function select(s){
  shape=s;mode='paint';document.getElementById('stage').classList.remove('puzzle-mode');puzzle.style.display='none';puzzle.innerHTML='';canvas.style.visibility='visible';bottom.style.display='flex';message.textContent='¡Pinta con el dedo!';homeScreen.classList.remove('active');paintScreen.classList.add('active');outline();
}
function goHome(){drawing=false;mode='paint';paintScreen.classList.remove('active');homeScreen.classList.add('active');}
canvas.addEventListener('pointerdown',function(e){drawing=true;try{canvas.setPointerCapture(e.pointerId);}catch(_){}dab(e);});
canvas.addEventListener('pointermove',function(e){if(drawing)dab(e);});
['pointerup','pointercancel','lostpointercapture'].forEach(function(x){canvas.addEventListener(x,function(){drawing=false;});});
document.querySelectorAll('.card').forEach(function(b){b.addEventListener('click',function(){select(b.dataset.shape);});});
document.querySelectorAll('[data-color]').forEach(function(b){b.addEventListener('click',function(){color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(function(v){v.classList.remove('selected');});b.classList.add('selected');});});
document.getElementById('reset').addEventListener('click',function(){outline();});
document.getElementById('homeBtn').addEventListener('click',goHome);
function startPuzzle(){
  if(mode==='puzzle')return;
  mode='puzzle';drawing=false;document.getElementById('stage').classList.add('puzzle-mode');canvas.style.visibility='hidden';bottom.style.display='none';puzzle.style.display='flex';puzzle.innerHTML='';message.textContent='¡Arrastra cada tarjeta a su hueco!';
  var board=document.createElement('div');board.className='puzzle-board';
  var tray=document.createElement('div');tray.className='puzzle-tray';
  var crop={x:40,y:30,w:720,h:540},pieceW=360,pieceH=270,positions=[[0,0],[1,0],[0,1],[1,1]],order=[2,0,3,1],slots=[];
  var preview=document.createElement('canvas');preview.width=800;preview.height=600;
  preview.getContext('2d').drawImage(canvas,crop.x,crop.y,crop.w,crop.h,0,0,800,600);
  board.style.setProperty('--puzzle-preview','url("'+preview.toDataURL('image/png')+'")');
  for(var i=0;i<4;i++){
    var slot=document.createElement('div');slot.className='target';slot.dataset.index=String(i);board.appendChild(slot);slots.push(slot);
  }
  order.forEach(function(index){
    var piece=document.createElement('div');piece.className='puzzle-piece';piece.dataset.index=String(index);
    var image=document.createElement('canvas');image.width=pieceW;image.height=pieceH;
    var p=positions[index],sx=crop.x+p[0]*crop.w/2,sy=crop.y+p[1]*crop.h/2;
    image.getContext('2d').drawImage(canvas,sx,sy,crop.w/2,crop.h/2,0,0,pieceW,pieceH);piece.appendChild(image);tray.appendChild(piece);
    var sx0,sy0,drag=false;
    piece.addEventListener('pointerdown',function(e){
      if(piece.dataset.locked)return;drag=true;sx0=e.clientX;sy0=e.clientY;piece.classList.add('dragging');piece.setPointerCapture(e.pointerId);e.preventDefault();
    });
    piece.addEventListener('pointermove',function(e){
      if(!drag)return;piece.style.transform='translate('+(e.clientX-sx0)+'px,'+(e.clientY-sy0)+'px)';
    });
    piece.addEventListener('pointerup',function(e){
      if(!drag)return;drag=false;piece.classList.remove('dragging');piece.style.transform='';
      var target=null;
      for(var j=0;j<slots.length;j++){var r=slots[j].getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){target=slots[j];break;}}
      if(target&&target.dataset.index===piece.dataset.index){
        target.appendChild(piece);piece.dataset.locked='yes';piece.setAttribute('aria-label','Pieza colocada');solved++;
        if(solved===4){message.textContent='¡Muy bien! 🎉';document.getElementById('celebrate').style.display='flex';setTimeout(function(){document.getElementById('celebrate').style.display='none';select(shape);},1800);}
      }
    });
    piece.addEventListener('pointercancel',function(){drag=false;piece.classList.remove('dragging');piece.style.transform='';});
  });
  solved=0;puzzle.appendChild(board);puzzle.appendChild(tray);
}
document.getElementById('done').addEventListener('click',startPuzzle);
})();
</script>
